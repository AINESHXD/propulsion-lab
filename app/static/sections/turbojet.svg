<g class="component" tabindex="0" data-name="Inlet" data-text="Diffuses the incoming air, slowing it and raising its pressure ahead of the compressor."><line class="leader" x1="165.0" y1="44" x2="165.0" y2="94.5"/><text class="label" x="165.0" y="36" text-anchor="middle">Inlet</text></g>
<g class="component" tabindex="0" data-name="Compressor" data-text="Eight axial stages, each a rotor then a stator, raise the pressure about twelvefold."><line class="leader" x1="380.0" y1="44" x2="380.0" y2="88.0"/><text class="label" x="380.0" y="36" text-anchor="middle">Compressor</text></g>
<g class="component" tabindex="0" data-name="Combustor" data-text="Fuel burns inside an annular liner; air outside the liner cools it and enters through dilution holes."><line class="leader" x1="670.0" y1="44" x2="670.0" y2="77.0"/><text class="label" x="670.0" y="36" text-anchor="middle">Combustor</text></g>
<g class="component" tabindex="0" data-name="Turbine" data-text="Two stages extract just enough work from the hot gas to drive the compressor on the shared shaft."><line class="leader" x1="805.0" y1="44" x2="805.0" y2="86.2"/><text class="label" x="805.0" y="36" text-anchor="middle">Turbine</text></g>
<g class="component" tabindex="0" data-name="Nozzle" data-text="The convergent nozzle accelerates the remaining hot gas into the thrust-producing jet."><line class="leader" x1="990.0" y1="44" x2="990.0" y2="127.5"/><text class="label" x="990.0" y="36" text-anchor="middle">Nozzle</text></g>
