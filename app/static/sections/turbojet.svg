<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 560" role="img" aria-labelledby="tj-title tj-desc" class="engine-section">
<title id="tj-title">Turbojet cross-section</title>
<desc id="tj-desc">Side cross-section of a single-spool turbojet: inlet, eight-stage axial compressor, annular combustor, two-stage turbine and convergent nozzle, with the gas path coloured by stagnation temperature from the PropulsionLab cycle solver.</desc>
